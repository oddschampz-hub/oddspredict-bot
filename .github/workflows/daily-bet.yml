name: Daily Bet Post

on:
  schedule:
    # Runs at 08:00 UTC every day = 10:00 SAST
    - cron: '0 8 * * *'
  workflow_dispatch:  # lets you trigger it manually from the GitHub website

jobs:
  post-bet:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit posted.json back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      - name: Commit updated posted.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/posted.json
          git diff --staged --quiet || git commit -m "Update posted log [skip ci]"
          git push